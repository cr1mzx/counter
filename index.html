<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tally Counter</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 500'><rect width='500' height='500' fill='%23000000'/><circle cx='250' cy='250' r='168' fill='none' stroke='%23ffffff' stroke-width='12'/><rect x='234' y='136' width='30' height='125' fill='%23ffffff'/><path d='M 210 136 L 240 136 L 240 158 L 210 158 Z' fill='%23ffffff'/><rect x='209' y='320' width='82' height='15' fill='%23ffffff'/><rect x='242' y='287' width='16' height='81' fill='%23ffffff'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #0d0e12;
            color: #f3f4f6;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .card-surface {
            background-color: #e2e8f0;
            color: #0f172a;
        }
        .dark-card-btn {
            background-color: #2b2f38;
            color: #ffffff;
        }
        .dark-card-btn:active {
            background-color: #3f4452;
        }
        .digit-container {
            position: relative;
            height: 1.15em;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
        }
        .digit-reel {
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .digit-reel.animate-up {
            animation: slideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .digit-reel.animate-down {
            animation: slideDown 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUp {
            0% { transform: translateY(0); }
            100% { transform: translateY(-1.15em); }
        }
        @keyframes slideDown {
            0% { transform: translateY(-1.15em); }
            100% { transform: translateY(0); }
        }
        .digit-num {
            height: 1.15em;
            line-height: 1.15em;
            text-align: center;
        }
        .btn-press-micro {
            transition: transform 0.08s ease;
        }
        .btn-press-micro:active {
            transform: scale(0.92);
        }
        .custom-switch {
            position: relative;
            width: 44px;
            height: 24px;
            background-color: #27272a;
            border-radius: 9999px;
            transition: background-color 0.2s ease;
            cursor: pointer;
        }
        .custom-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background-color: #ffffff;
            border-radius: 9999px;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        input:checked + .custom-switch {
            background-color: #10b981;
        }
        input:checked + .custom-switch::after {
            transform: translateX(20px);
        }

        /* Обновленные аккуратные стили подложки свайпа */
        .swipe-container {
            position: relative;
            overflow: hidden;
            border-radius: 1rem;
            touch-action: pan-y;
            background-color: transparent;
        }
        .swipe-action-left {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background-color: #e11d48;
            color: white;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 1.75rem;
            border-radius: 1rem;
            z-index: 0;
            cursor: pointer;
        }
        .swipe-content {
            position: relative;
            z-index: 10;
            transition: transform 0.2s ease-out;
            will-change: transform;
            border-radius: 1rem;
        }
        .swipe-content.swiping {
            transition: none;
        }
    </style>
</head>
<body class="h-full w-full bg-[#0d0e12] text-gray-100 flex flex-col justify-between overflow-hidden">

    <script>
        class SoundFX {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            playClick() {
                if (!appSettings.sound) return;
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.04);
                    gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.04);
                } catch (e) {}
            }
        }
        const audioFX = new SoundFX();

        let counters = [];
        let statsLog = [];
        let activeCounterId = null;
        let counterHistory = [];
        let editingCounterId = null;
        let isLocked = false;
        let statsChartInstance = null;
        let previousDisplayedValueStr = null;

        let appSettings = { vibration: true, sound: true };

        function loadData() {
            const savedCounters = localStorage.getItem('tally_counters_v3');
            const savedSettings = localStorage.getItem('tally_settings_v3');
            const savedStats = localStorage.getItem('tally_stats_v3');

            if (savedCounters) {
                try { counters = JSON.parse(savedCounters); } catch(e) { counters = []; }
            } else {
                counters = [];
            }

            if (savedSettings) try { appSettings = { ...appSettings, ...JSON.parse(savedSettings) }; } catch(e){}
            if (savedStats) try { statsLog = JSON.parse(savedStats); } catch(e){ statsLog = []; }

            document.getElementById('setting-vibration').checked = appSettings.vibration;
            document.getElementById('setting-sound').checked = appSettings.sound;

            checkAutoResets();
        }

        function saveData() {
            localStorage.setItem('tally_counters_v3', JSON.stringify(counters));
            localStorage.setItem('tally_settings_v3', JSON.stringify(appSettings));
            localStorage.setItem('tally_stats_v3', JSON.stringify(statsLog));
        }

        function checkAutoResets() {
            const now = new Date();
            let changed = false;

            counters.forEach(c => {
                if (!c.resetPeriod || c.resetPeriod === 'none') return;
                const last = c.lastReset ? new Date(c.lastReset) : new Date(0);

                let shouldReset = false;
                if (c.resetPeriod === 'hourly' && (now - last) >= 3600000) shouldReset = true;
                else if (c.resetPeriod === 'daily' && now.toDateString() !== last.toDateString()) shouldReset = true;
                else if (c.resetPeriod === 'weekly' && (now - last) >= 604800000) shouldReset = true;
                else if (c.resetPeriod === 'monthly' && now.getMonth() !== last.getMonth()) shouldReset = true;
                else if (c.resetPeriod === 'yearly' && now.getFullYear() !== last.getFullYear()) shouldReset = true;

                if (shouldReset) {
                    c.value = 0;
                    c.lastReset = Date.now();
                    changed = true;
                }
            });

            if (changed) saveData();
        }

        function triggerFeedback() {
            if (appSettings.vibration && navigator.vibrate) navigator.vibrate(12);
            if (appSettings.sound) audioFX.playClick();
        }

        function deleteCounter(id) {
            const counter = counters.find(c => c.id === id);
            const title = counter ? counter.title : 'счётчик';
            
            if (confirm(`Вы действительно хотите удалить "${title}"?`)) {
                counters = counters.filter(c => c.id !== id);
                statsLog = statsLog.filter(s => s.counterId !== id);
                
                if (activeCounterId === id) {
                    document.getElementById('view-detail').classList.add('hidden');
                    activeCounterId = null;
                }

                saveData();
                renderCountersList();
                if (!document.getElementById('tab-stats').classList.contains('hidden')) {
                    updateStatsCounterFilterOptions();
                    renderStats();
                }
            }
        }

        function renderReels(number, direction = 'up', forceRebuild = false) {
            const container = document.getElementById('detail-counter-value');
            const newStr = number.toString();
            
            if (forceRebuild || !previousDisplayedValueStr || previousDisplayedValueStr.length !== newStr.length) {
                container.innerHTML = '';
                for (let i = 0; i < newStr.length; i++) {
                    const char = newStr[i];
                    if (/\d/.test(char)) {
                        const digitBox = document.createElement('div');
                        digitBox.className = 'digit-container';
                        digitBox.innerHTML = `<div class="digit-reel"><div class="digit-num">${char}</div></div>`;
                        container.appendChild(digitBox);
                    } else {
                        const sign = document.createElement('span');
                        sign.innerText = char;
                        container.appendChild(sign);
                    }
                }
                previousDisplayedValueStr = newStr;
                return;
            }

            const reels = container.querySelectorAll('.digit-reel');
            let reelIdx = 0;

            for (let i = 0; i < newStr.length; i++) {
                const newChar = newStr[i];
                if (!/\d/.test(newChar)) continue;

                const reel = reels[reelIdx++];
                const prevChar = previousDisplayedValueStr[i] || '0';

                if (prevChar !== newChar) {
                    reel.classList.remove('animate-up', 'animate-down');
                    
                    if (direction === 'up') {
                        reel.innerHTML = `<div class="digit-num">${prevChar}</div><div class="digit-num">${newChar}</div>`;
                        void reel.offsetWidth;
                        reel.classList.add('animate-up');
                    } else {
                        reel.innerHTML = `<div class="digit-num">${newChar}</div><div class="digit-num">${prevChar}</div>`;
                        void reel.offsetWidth;
                        reel.classList.add('animate-down');
                    }
                }
            }

            previousDisplayedValueStr = newStr;
        }

        function renderCountersList() {
            const container = document.getElementById('counters-container');
            const searchVal = document.getElementById('search-input').value.toLowerCase().trim();
            container.innerHTML = '';

            const filtered = counters.filter(c => c.title.toLowerCase().includes(searchVal));

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-zinc-500 text-sm">Нет счётчиков</div>`;
                lucide.createIcons();
                return;
            }

            filtered.forEach(c => {
                const wrapper = document.createElement('div');
                wrapper.className = "swipe-container";

                wrapper.innerHTML = `
                    <div class="swipe-action-left" onclick="deleteCounter('${c.id}')">
                        <i data-lucide="trash-2" class="w-6 h-6"></i>
                    </div>
                    <div class="swipe-content card-surface rounded-2xl p-4 shadow-md flex items-center justify-between gap-3 cursor-pointer hover:brightness-105">
                        <div class="flex-1 min-w-0" onclick="openDetailView('${c.id}')">
                            <h3 class="font-bold text-base text-slate-900 truncate">${escapeHtml(c.title)}</h3>
                            <span class="text-3xl font-black text-slate-950">${c.value}</span>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            <button onclick="event.stopPropagation(); changeCounterValue('${c.id}', -${c.step})" class="w-10 h-10 rounded-xl bg-slate-300 text-slate-900 flex items-center justify-center font-bold text-xl btn-press-micro">
                                <i data-lucide="minus" class="w-5 h-5 stroke-[3]"></i>
                            </button>
                            <button onclick="event.stopPropagation(); changeCounterValue('${c.id}', ${c.step})" class="w-14 h-10 rounded-xl dark-card-btn flex items-center justify-center font-bold text-xl btn-press-micro">
                                <i data-lucide="plus" class="w-6 h-6 stroke-[3]"></i>
                            </button>
                        </div>
                    </div>
                `;

                const swipeContent = wrapper.querySelector('.swipe-content');
                let startX = 0;
                let currentX = 0;
                let isSwiping = false;

                const onTouchStart = (e) => {
                    startX = e.touches ? e.touches[0].clientX : e.clientX;
                    isSwiping = true;
                    swipeContent.classList.add('swiping');
                };

                const onTouchMove = (e) => {
                    if (!isSwiping) return;
                    const x = e.touches ? e.touches[0].clientX : e.clientX;
                    const diff = x - startX;
                    if (diff > 0) {
                        currentX = Math.min(diff, 90);
                        swipeContent.style.transform = `translateX(${currentX}px)`;
                    } else if (currentX > 0) {
                        currentX = Math.max(0, 80 + diff);
                        swipeContent.style.transform = `translateX(${currentX}px)`;
                    }
                };

                const onTouchEnd = () => {
                    if (!isSwiping) return;
                    isSwiping = false;
                    swipeContent.classList.remove('swiping');
                    if (currentX > 40) {
                        currentX = 80;
                        swipeContent.style.transform = `translateX(80px)`;
                    } else {
                        currentX = 0;
                        swipeContent.style.transform = `translateX(0px)`;
                    }
                };

                swipeContent.addEventListener('touchstart', onTouchStart, { passive: true });
                swipeContent.addEventListener('touchmove', onTouchMove, { passive: true });
                swipeContent.addEventListener('touchend', onTouchEnd);

                swipeContent.addEventListener('mousedown', onTouchStart);
                window.addEventListener('mousemove', onTouchMove);
                window.addEventListener('mouseup', onTouchEnd);

                container.appendChild(wrapper);
            });

            lucide.createIcons();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }

        function changeCounterValue(id, delta) {
            const counter = counters.find(c => c.id === id);
            if (!counter) return;

            counterHistory.push({ id: counter.id, prevValue: counter.value });
            if (counterHistory.length > 20) counterHistory.shift();

            counter.value += delta;
            saveData();
            triggerFeedback();

            statsLog.push({
                counterId: counter.id,
                timestamp: Date.now(),
                delta: delta
            });
            saveData();

            if (activeCounterId === id) {
                renderReels(counter.value, delta > 0 ? 'up' : 'down');
            }
            renderCountersList();
        }

        function openDetailView(id) {
            activeCounterId = id;
            const counter = counters.find(c => c.id === activeCounterId);
            if (!counter) return;

            document.getElementById('detail-counter-title').innerText = counter.title;
            const periodLabels = { hourly: 'Обнуление: Раз в час', daily: 'Обнуление: Каждый день', weekly: 'Обнуление: Раз в неделю', monthly: 'Обнуление: Раз в месяц', yearly: 'Обнуление: Раз в год' };
            document.getElementById('detail-reset-period').innerText = periodLabels[counter.resetPeriod] || '';
            
            previousDisplayedValueStr = null;
            renderReels(counter.value, 'up', true);
            document.getElementById('view-detail').classList.remove('hidden');
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');

            ['counters', 'stats', 'settings'].forEach(t => {
                const btn = document.getElementById(`nav-btn-${t}`);
                if (btn) {
                    if (t === tabName) btn.className = 'flex flex-col items-center gap-0.5 text-white';
                    else btn.className = 'flex flex-col items-center gap-0.5 text-zinc-500';
                }
            });

            if (tabName === 'stats') {
                updateStatsCounterFilterOptions();
                renderStats();
            }
        }

        function openAddModal() {
            editingCounterId = null;
            document.getElementById('modal-title').innerText = "Новый счётчик";
            document.getElementById('modal-input-title').value = "";
            document.getElementById('modal-input-value').value = 0;
            document.getElementById('modal-input-step').value = 1;
            document.getElementById('modal-input-reset-period').value = "none";
            document.getElementById('modal-counter').classList.remove('hidden');
        }

        function updateStatsCounterFilterOptions() {
            const select = document.getElementById('stats-counter-filter');
            const currentVal = select.value;
            select.innerHTML = '<option value="all">Все счётчики</option>';
            counters.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.innerText = c.title;
                select.appendChild(opt);
            });
            if (counters.some(c => c.id === currentVal)) {
                select.value = currentVal;
            } else {
                select.value = 'all';
            }
        }

        function renderStats() {
            const picker = document.getElementById('stats-date-picker');
            if (!picker.value) {
                picker.value = new Date().toISOString().split('T')[0];
            }
            const selectedDateStr = new Date(picker.value).toDateString();
            const selectedCounterId = document.getElementById('stats-counter-filter').value;

            const activeCounterIds = new Set(counters.map(c => c.id));
            const filteredLog = statsLog.filter(s => activeCounterIds.has(s.counterId) && (selectedCounterId === 'all' || s.counterId === selectedCounterId));

            const totalSumAllTime = filteredLog.reduce((acc, log) => acc + log.delta, 0);
            document.getElementById('stat-total-clicks').innerText = totalSumAllTime;

            const dayLogs = filteredLog.filter(s => new Date(s.timestamp).toDateString() === selectedDateStr);
            const selectedDaySum = dayLogs.reduce((acc, log) => acc + log.delta, 0);
            document.getElementById('stat-selected-day-sum').innerText = selectedDaySum > 0 ? `+${selectedDaySum}` : selectedDaySum;

            const breakdownContainer = document.getElementById('stats-counters-breakdown');
            breakdownContainer.innerHTML = '';

            const counterSums = {};
            dayLogs.forEach(log => {
                const liveCounter = counters.find(c => c.id === log.counterId);
                const title = liveCounter ? liveCounter.title : (log.title || 'Счётчик');

                if (!counterSums[log.counterId]) {
                    counterSums[log.counterId] = { title: title, sum: 0, clicks: 0 };
                }
                counterSums[log.counterId].sum += log.delta;
                counterSums[log.counterId].clicks += 1;
            });

            const entries = Object.values(counterSums);
            if (entries.length === 0) {
                breakdownContainer.innerHTML = `<p class="text-xs text-zinc-500 py-2">За этот день нет активностей</p>`;
            } else {
                entries.forEach(item => {
                    const el = document.createElement('div');
                    el.className = "flex items-center justify-between p-2.5 bg-zinc-950/60 rounded-xl border border-zinc-800/50";
                    el.innerHTML = `
                        <div>
                            <span class="font-semibold text-xs text-zinc-200 block">${escapeHtml(item.title)}</span>
                            <span class="text-[10px] text-zinc-500">Действий: ${item.clicks}</span>
                        </div>
                        <span class="font-black text-sm ${item.sum > 0 ? 'text-emerald-400' : item.sum < 0 ? 'text-rose-400' : 'text-zinc-400'}">
                            ${item.sum > 0 ? '+' : ''}${item.sum}
                        </span>
                    `;
                    breakdownContainer.appendChild(el);
                });
            }

            renderChart(filteredLog);
        }

        function renderChart(logs) {
            const ctx = document.getElementById('statsChart').getContext('2d');
            
            const days = [];
            const sums = [];
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dayStr = d.toDateString();
                days.push(d.toLocaleDateString([], { weekday: 'short' }));
                
                const daySum = logs
                    .filter(s => new Date(s.timestamp).toDateString() === dayStr)
                    .reduce((acc, log) => acc + log.delta, 0);
                sums.push(daySum);
            }

            if (statsChartInstance) statsChartInstance.destroy();

            statsChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: days,
                    datasets: [{
                        data: sums,
                        backgroundColor: sums.map(v => v >= 0 ? '#ffffff' : '#f43f5e'),
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: '#a1a1aa', font: { size: 10 } } },
                        y: { grid: { color: '#27272a' }, ticks: { color: '#a1a1aa', font: { size: 10 } } }
                    }
                }
            });
        }

        function exportBackupJSON() {
            const backupData = {
                version: "3.0",
                exportDate: new Date().toISOString(),
                settings: appSettings,
                counters: counters,
                statsLog: statsLog
            };

            const jsonStr = JSON.stringify(backupData, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `tally_backup_${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importBackupJSON(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.counters && Array.isArray(imported.counters) && imported.statsLog && Array.isArray(imported.statsLog)) {
                        counters = imported.counters;
                        statsLog = imported.statsLog;
                        if (imported.settings) appSettings = { ...appSettings, ...imported.settings };

                        saveData();
                        document.getElementById('setting-vibration').checked = appSettings.vibration;
                        document.getElementById('setting-sound').checked = appSettings.sound;

                        renderCountersList();
                        alert('Данные успешно импортированы!');
                    } else {
                        alert('Неверный формат JSON файла!');
                    }
                } catch(err) {
                    alert('Ошибка чтения файла!');
                }
            };
            reader.readAsText(file);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            renderCountersList();

            document.getElementById('stats-date-picker').addEventListener('change', renderStats);
            document.getElementById('stats-counter-filter').addEventListener('change', renderStats);

            document.getElementById('btn-open-search').addEventListener('click', () => {
                const search = document.getElementById('search-bar-container');
                search.classList.toggle('hidden');
            });
            document.getElementById('search-input').addEventListener('input', renderCountersList);

            document.getElementById('btn-back-to-list').addEventListener('click', () => {
                document.getElementById('view-detail').classList.add('hidden');
                activeCounterId = null;
            });

            document.getElementById('btn-big-plus').addEventListener('click', () => {
                if (isLocked || !activeCounterId) return;
                const counter = counters.find(c => c.id === activeCounterId);
                if (counter) changeCounterValue(counter.id, counter.step);
            });

            document.getElementById('btn-big-minus').addEventListener('click', () => {
                if (isLocked || !activeCounterId) return;
                const counter = counters.find(c => c.id === activeCounterId);
                if (counter) changeCounterValue(counter.id, -counter.step);
            });

            document.getElementById('btn-big-undo').addEventListener('click', () => {
                if (isLocked || counterHistory.length === 0) return;
                const last = counterHistory.pop();
                const counter = counters.find(c => c.id === last.id);
                if (counter) {
                    const delta = last.prevValue - counter.value;
                    counter.value = last.prevValue;
                    saveData();
                    triggerFeedback();
                    
                    statsLog.push({ counterId: counter.id, timestamp: Date.now(), delta: delta });
                    saveData();

                    renderReels(counter.value, delta > 0 ? 'up' : 'down');
                    renderCountersList();
                }
            });

            document.getElementById('btn-sub-lock').addEventListener('click', () => {
                isLocked = !isLocked;
                const lockIcon = document.getElementById('lock-icon');
                if (isLocked) {
                    lockIcon.setAttribute('data-lucide', 'lock');
                    document.getElementById('btn-big-plus').classList.add('opacity-40');
                } else {
                    lockIcon.setAttribute('data-lucide', 'unlock');
                    document.getElementById('btn-big-plus').classList.remove('opacity-40');
                }
                lucide.createIcons();
            });

            document.getElementById('btn-reset-counter').addEventListener('click', () => {
                if (!activeCounterId) return;
                if (confirm('Сбросить счётчик на 0?')) {
                    const counter = counters.find(c => c.id === activeCounterId);
                    if (counter) {
                        const delta = -counter.value;
                        counter.value = 0;
                        saveData();

                        statsLog.push({ counterId: counter.id, timestamp: Date.now(), delta: delta });
                        saveData();

                        previousDisplayedValueStr = null;
                        renderReels(0, 'down', true);
                        renderCountersList();
                    }
                }
            });

            document.getElementById('btn-edit-counter').addEventListener('click', () => {
                if (!activeCounterId) return;
                const counter = counters.find(c => c.id === activeCounterId);
                if (!counter) return;

                editingCounterId = counter.id;
                document.getElementById('modal-title').innerText = "Редактировать";
                document.getElementById('modal-input-title').value = counter.title;
                document.getElementById('modal-input-value').value = counter.value;
                document.getElementById('modal-input-step').value = counter.step || 1;
                document.getElementById('modal-input-reset-period').value = counter.resetPeriod || "none";
                document.getElementById('modal-counter').classList.remove('hidden');
            });

            document.getElementById('modal-btn-cancel').addEventListener('click', () => {
                document.getElementById('modal-counter').classList.add('hidden');
            });

            document.getElementById('modal-btn-save').addEventListener('click', () => {
                const title = document.getElementById('modal-input-title').value.trim() || "Счётчик";
                const val = parseInt(document.getElementById('modal-input-value').value) || 0;
                const step = Math.max(1, parseInt(document.getElementById('modal-input-step').value) || 1);
                const period = document.getElementById('modal-input-reset-period').value;

                if (editingCounterId) {
                    const counter = counters.find(c => c.id === editingCounterId);
                    if (counter) {
                        counter.title = title;
                        counter.value = val;
                        counter.step = step;
                        counter.resetPeriod = period;
                    }
                } else {
                    counters.push({
                        id: Date.now().toString(),
                        title: title,
                        value: val,
                        step: step,
                        resetPeriod: period,
                        lastReset: Date.now()
                    });
                }

                saveData();
                renderCountersList();
                if (activeCounterId) openDetailView(activeCounterId);
                document.getElementById('modal-counter').classList.add('hidden');
            });

            document.getElementById('setting-vibration').addEventListener('change', (e) => { appSettings.vibration = e.target.checked; saveData(); });
            document.getElementById('setting-sound').addEventListener('change', (e) => { appSettings.sound = e.target.checked; saveData(); });

            document.getElementById('btn-export-data').addEventListener('click', exportBackupJSON);
            document.getElementById('btn-import-trigger').addEventListener('click', () => {
                document.getElementById('import-file-input').click();
            });
            document.getElementById('import-file-input').addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    importBackupJSON(e.target.files[0]);
                }
            });

            document.getElementById('btn-clear-all').addEventListener('click', () => {
                if (confirm('Удалить ВСЕ данные и статистику?')) {
                    counters = [];
                    statsLog = [];
                    saveData();
                    renderCountersList();
                    switchTab('counters');
                }
            });
        });

        window.addEventListener('load', () => lucide.createIcons());
    </script>
</body>
</html>
